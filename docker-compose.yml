version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rf_local_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rf_intelligence_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - rf_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rf_intelligence_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rf_local_pgdata:
